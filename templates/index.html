<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annexure A Generator · Envision Next</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f8; --bg-2:#f7f9fe;
    --card:#ffffff; --card-2:#f4f6fb;
    --border:#e6e9f2; --border-hover:rgba(91,124,255,.55);
    --text:#141824; --muted:#707892; --line-soft:#eef1f7;
    --accent:#5b7cff; --accent-2:#9b6bff; --accent-3:#e08bff;
    --glow:rgba(91,124,255,.22);
    --hero:linear-gradient(100deg,#5b7cff,#9b6bff 60%,#e08bff);
    --shadow:0 1px 2px rgba(20,30,70,.04),0 12px 34px -18px rgba(30,40,90,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,Arial,sans-serif; color:var(--text);
    background:
      radial-gradient(1100px 480px at 88% -8%,rgba(224,139,255,.12),transparent 60%),
      radial-gradient(1000px 460px at -6% 6%,rgba(91,124,255,.12),transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh; position:relative; overflow-x:hidden;
  }

  /* ---------- INTRO SPLASH (dark, like the reference) ---------- */
  #intro{
    position:fixed; inset:0; z-index:50; display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 35%,#0b0d16 0%,#07080f 60%,#05060a 100%);
    transition:opacity .7s ease, visibility .7s ease;
  }
  /* glowing accent orbs behind the logo */
  #intro::before,#intro::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;}
  #intro::before{width:420px;height:420px;background:var(--accent);top:12%;left:20%;opacity:.5;}
  #intro::after{width:380px;height:380px;background:var(--accent-3);bottom:12%;right:20%;opacity:.42;}
  #intro.hide{opacity:0; visibility:hidden;}
  .intro-inner{position:relative;z-index:1;text-align:center;transform:translateY(6px);animation:introRise .9s cubic-bezier(.2,.7,.2,1) both;}
  .intro-logo{
    width:min(440px,72vw);margin:0 auto 14px;display:block;
    filter:drop-shadow(0 14px 40px rgba(91,124,255,.5));
    animation:pop .8s cubic-bezier(.2,1.3,.3,1) both;
  }
  .intro-title{
    font-family:'Space Grotesk';font-weight:700;font-size:38px;margin:0;letter-spacing:-.5px;
    background:linear-gradient(100deg,#7d97ff,#b58bff 50%,#e08bff,#7d97ff);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 2.2s linear infinite;
  }
  .intro-sub{color:#9aa3bd;font-size:13px;margin-top:8px;letter-spacing:.18em;text-transform:uppercase;}
  .intro-bar{width:180px;height:4px;margin:22px auto 0;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;}
  .intro-bar > span{display:block;height:100%;width:0;border-radius:999px;background:var(--hero);animation:fill 2.1s ease forwards;}
  @keyframes introRise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
  @keyframes shimmer{to{background-position:220% center;}}
  @keyframes fill{0%{width:0;}100%{width:100%;}}

  /* fade the app in after intro */
  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:26px 22px 70px;
        opacity:0; transition:opacity .6s ease .1s;}
  body.ready .wrap{opacity:1;}

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-logo{height:38px;width:auto;display:block;}
  .logo{width:42px;height:42px;border-radius:12px;
        background:linear-gradient(135deg,#151a2b,#0b0d16);
        box-shadow:0 10px 26px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.12);
        display:grid;place-items:center;padding:8px;}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-title{font-family:'Space Grotesk';font-weight:600;font-size:18px;line-height:1;}
  .brand-sub{color:var(--muted);font-size:12px;}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--border);font-weight:500;
        padding:7px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);}

  .hero{margin-bottom:22px;}
  .hero h1{font-family:'Space Grotesk';font-weight:700;font-size:32px;margin:0 0 8px;letter-spacing:-.4px;
           background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);margin:0;font-size:14.5px;max-width:640px;line-height:1.55;}

  .glass{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow);
  }
  .source{font-size:12px;padding:8px 13px;border-radius:999px;display:inline-flex;gap:8px;
          align-items:center;margin-bottom:18px;border:1px solid var(--border);}
  .source .dot{width:8px;height:8px;border-radius:50%;}
  .source.real{background:rgba(16,185,129,.12);color:#047857;}
  .source.real .dot{background:#10b981;}
  .source.sample{background:rgba(224,139,255,.14);color:#9333ea;}
  .source.sample .dot{background:var(--accent-3);}

  .searchbar{display:flex;gap:10px;padding:14px;margin-bottom:22px;position:relative;}
  .searchwrap{flex:1;position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    background:var(--card-2);border:1px solid var(--border);border-radius:11px;padding:5px 8px;cursor:text;
    transition:border .15s,box-shadow .15s,background .15s;}
  .searchwrap:hover{background:#fff;}
  .searchwrap:focus-within{border-color:var(--border-hover);box-shadow:0 0 0 3px var(--glow);background:#fff;}
  .searchwrap input[type=text]{flex:1;min-width:160px;border:none;background:transparent;box-shadow:none;padding:8px 6px;}
  .searchwrap input[type=text]:hover,.searchwrap input[type=text]:focus{border:none;box-shadow:none;background:transparent;}
  #chips{display:contents;}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
    background:#fff;border:1px solid var(--border-hover);color:var(--accent);
    border-radius:999px;padding:6px 11px;white-space:nowrap;}
  .chip .x{cursor:pointer;font-weight:700;opacity:.6;font-size:14px;line-height:1;}
  .chip .x:hover{opacity:1;}
  #suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;
    background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    max-height:320px;overflow:auto;display:none;}
  #suggest.open{display:block;}
  .sug{padding:10px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;
    gap:10px;align-items:center;border-bottom:1px solid var(--line-soft);}
  .sug:last-child{border-bottom:none;}
  .sug:hover,.sug.sel{background:var(--card-2);}
  .sug .tag{font-size:11px;color:var(--muted);white-space:nowrap;}
  .sug b{font-weight:600;}
  input[type=text]{flex:1;padding:13px 15px;font-size:15px;color:var(--text);
    background:var(--card-2);border:1px solid var(--border);border-radius:11px;outline:none;
    transition:border .15s,box-shadow .15s,background .15s;}
  input[type=text]:hover{background:#fff;}
  input[type=text]::placeholder{color:var(--muted);}
  input[type=text]:focus{border-color:var(--border-hover);box-shadow:0 0 0 3px var(--glow);}
  button{font-family:'Inter';font-weight:600;padding:13px 18px;font-size:14px;border:none;
    border-radius:12px;cursor:pointer;color:#fff;background:var(--hero);
    box-shadow:0 12px 26px -12px var(--glow);transition:transform .12s,filter .12s,opacity .12s;}
  button:hover{transform:translateY(-1px);filter:brightness(1.05);}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  button.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border);box-shadow:none;}
  button.ghost:hover{background:#fff;}

  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .person{padding:18px;margin-bottom:16px;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s;}
  .person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hero);opacity:0;transition:opacity .18s;}
  .person.active{border-color:var(--border-hover);box-shadow:0 1px 2px rgba(20,30,70,.04),0 18px 44px -22px var(--glow);}
  .person.active::before{opacity:1;}
  .person h3{font-family:'Space Grotesk';margin:0 0 12px;font-size:17px;}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .field label{font-size:12px;color:var(--muted);min-width:120px;font-weight:500;}
  .field input{max-width:260px;padding:9px 12px;font-size:14px;background:var(--card-2);
    border:1px solid var(--border);border-radius:9px;outline:none;transition:border .15s,box-shadow .15s;}
  .field input:focus{border-color:var(--border-hover);box-shadow:0 0 0 3px var(--glow);background:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  td.addr{color:#3b4252;max-width:240px;}
  tr.off td:not(.chk){opacity:.35;text-decoration:line-through;}
  .chk{width:34px;}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
  .actions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .hint{color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);padding:16px 4px;}

  /* live preview */
  .preview-col{position:sticky;top:20px;}
  .preview-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
  .preview-head .t{font-family:'Space Grotesk';font-weight:600;font-size:14px;}
  .live-tag{font-size:11px;color:#047857;display:flex;align-items:center;gap:6px;}
  .live-tag .dot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5);}70%{box-shadow:0 0 0 8px rgba(16,185,129,0);}100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}}
  .paper{background:#fff;color:#111;border-radius:0 0 18px 18px;padding:26px 26px 30px;
         font-family:'Times New Roman',serif;max-height:74vh;overflow:auto;}
  .paper h2{text-align:center;font-size:15px;margin:0 0 2px;}
  .paper .center{text-align:center;font-size:12px;color:#333;margin-bottom:14px;}
  .paper .row{font-size:13px;margin:6px 0;}
  .paper table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-family:'Times New Roman',serif;}
  .paper th,.paper td{border:1px solid #333;color:#111;padding:5px 7px;font-size:11.5px;text-transform:none;letter-spacing:0;}
  .paper th{background:#f0f0f0;font-weight:700;}
  .paper .sig{margin-top:22px;font-size:13px;}
  .paper .pg{position:relative;padding-bottom:30px;}
  .paper .pg + .pg{margin-top:20px;border-top:2px dashed #c3c9d6;padding-top:20px;}
  .paper .pgnum{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10.5px;color:#888;font-family:'Inter',sans-serif;}
</style>
</head>
<body>

<!-- Intro splash -->
<div id="intro">
  <div class="intro-inner">
    <img class="intro-logo" src="/static/logo.png" alt="Envision Next">
    <h1 class="intro-title">Annexure A Generator</h1>
    <div class="intro-sub">Envision Next</div>
    <div class="intro-bar"><span></span></div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <img class="brand-logo" src="/static/logo-inside.png" alt="Envision Next">
    </div>
    <div class="pill" id="countPill">—</div>
  </header>

  <div id="source" class="source sample"><span class="dot"></span> Loading data source…</div>

  <div class="glass searchbar">
    <div class="searchwrap" onclick="document.getElementById('q').focus()">
      <span id="chips"></span>
      <input id="q" type="text" placeholder="Search organisation / promoter name (e.g. Mayfair)…" autocomplete="off">
      <div id="suggest"></div>
    </div>
    <button id="searchBtn">Search</button>
    <button id="reloadBtn" class="ghost" title="Re-read the Excel file">Reload Excel</button>
  </div>
  <div class="hint" style="margin:-12px 2px 22px;">Type at least 2 letters, then press Enter · Pick more than one name from the dropdown to combine the same person's different spellings into one Annexure.</div>

  <div class="grid">
    <div id="results"></div>
    <div class="preview-col">
      <div class="glass" style="overflow:hidden;">
        <div class="preview-head">
          <span class="t">Live Preview</span>
          <span class="live-tag"><span class="dot"></span> live</span>
        </div>
        <div id="preview" class="paper"><div style="color:#888;font-family:Inter;">Select a person to preview their Annexure A.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s)=>document.querySelector(s);
let PEOPLE = [];
let activePid = null;

function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function today(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;}

async function loadSource(){
  const s = await (await fetch('/api/source')).json();
  const el=$('#source');
  if(s.using_excel){
    const cols=Object.entries(s.columns).map(([k,v])=>`${k}→"${v}"`).join(', ');
    el.className='source real';
    el.innerHTML=`<span class="dot"></span> Using Excel: <b>&nbsp;${esc(s.file)}</b>&nbsp; ${cols?('· '+esc(cols)):''}`;
  }else{
    el.className='source sample';
    el.innerHTML='<span class="dot"></span> No Excel found yet — showing sample data. Drop your .xlsx in this folder and click “Reload Excel”.';
  }
}

function isNAProj(o){
  const na=v=>!v||String(v).trim().toUpperCase()==='NA';
  return na(o.rera)||na(o.name)||na(o.completion);
}
function cardOf(p){
  const rows=p.orgs.map((o,i)=>{const off=isNAProj(o);return `
    <tr data-i="${i}" class="${off?'off':'on'}">
      <td class="chk"><input type="checkbox" ${off?'':'checked'} onchange="onChange(${p.id})"></td>
      <td>${i+1}</td>
      <td>${esc(o.name)}</td>
      <td class="addr">${esc(o.address)}</td>
      <td>${esc(o.rera)}</td>
      <td>${esc(o.completion)}</td>
    </tr>`;}).join('');
  return `
  <div class="glass person" data-pid="${p.id}" onclick="setActive(${p.id})">
    <h3>${esc(p.merged?p.label:p.name)}</h3>
    ${p.merged?`<div class="hint" style="margin:-8px 0 12px;">Combined from ${p.sources} names · ${p.orgs.length} project(s), duplicates removed</div>
    <div class="field">
      <label for="nm-${p.id}">Name on document</label>
      <input id="nm-${p.id}" type="text" value="${esc(p.docName)}" placeholder="Name printed on the Annexure"
             oninput="onChange(${p.id})">
    </div>`:''}
    <div class="field">
      <label for="din-${p.id}">DIN/DPIN (If applicable)</label>
      <input id="din-${p.id}" type="text" value="${esc(p.din)}" placeholder="Enter DIN/DPIN"
             oninput="onChange(${p.id})">
    </div>
    <table>
      <thead><tr><th class="chk"></th><th>S.No</th><th>Organization</th><th>Address</th><th>RERA No.</th><th>Completion</th></tr></thead>
      <tbody>${rows||'<tr><td class="chk"></td><td>NA</td><td>NA</td><td>NA</td><td>NA</td><td>NA</td></tr>'}</tbody>
    </table>
    <div class="actions">
      <button onclick="event.stopPropagation();generate(${p.id},this)">Generate Word</button>
      <span class="hint">Only ticked rows are included · Date auto-set to today · Place removed.</span>
    </div>
  </div>`;
}

function personCardEl(pid){return document.querySelector(`.person[data-pid="${pid}"]`);}
function readDin(pid){const el=$(`#din-${pid}`);return el?el.value:'';}
function readName(p){const el=$(`#nm-${p.id}`);return (el&&el.value.trim())||p.name;}
function readKeep(pid){
  const card=personCardEl(pid);
  return [...card.querySelectorAll('tbody tr[data-i]')]
    .filter(tr=>tr.querySelector('input[type=checkbox]')?.checked)
    .map(tr=>parseInt(tr.dataset.i,10));
}

function setActive(pid){
  activePid=pid;
  document.querySelectorAll('.person').forEach(c=>c.classList.toggle('active',+c.dataset.pid===pid));
  renderPreview(pid);
}

function onChange(pid){
  const card=personCardEl(pid);
  card.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
    const on=tr.querySelector('input[type=checkbox]')?.checked;
    tr.classList.toggle('off',!on);tr.classList.toggle('on',!!on);
  });
  setActive(pid);
}

function renderPreview(pid){
  const p=PEOPLE.find(x=>x.id===pid);
  const box=$('#preview');
  if(!p){box.innerHTML='<div style="color:#888;font-family:Inter;">Select a person to preview.</div>';return;}
  const docName=readName(p);
  const din=readDin(pid);
  const keep=new Set(readKeep(pid));
  const chosen=p.orgs.filter((_,i)=>keep.has(i));
  const orgRows=chosen.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.name)}</td><td>${esc(o.address)}</td><td>${esc(o.rera)}</td></tr>`).join('')
    || '<tr><td>NA</td><td>NA</td><td>NA</td><td>NA</td></tr>';
  const statRows=chosen.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.rera)}</td><td>${esc(o.completion)}</td><td>${esc(o.complaints)}</td><td>${esc(o.warrants)}</td><td>${esc(o.revoked)}</td></tr>`).join('')
    || '<tr><td>NA</td><td>NA</td><td>NA</td><td>NA</td><td>NA</td><td>NA</td></tr>';
  paginateInto(box,`
    <h2>Annexure A</h2>
    <div class="center">Disclosure of Interest in Other Real Estate Organizations</div>
    <div class="row"><b>Name:</b> ${esc(docName)}</div>
    <div class="row"><b>DIN/DPIN (If applicable):</b> ${esc(din)||'—'}</div>
    <div class="row">Are you a Director/ Designated Partner/ Partner/ Proprietor of any organization whose real estate project is registered with any RERA across the country? – <b>${chosen.length?'Yes':'No'}</b></div>
    <div class="row">If yes, please provide the following information:</div>
    <table><thead><tr><th>S.No</th><th>Name of the organization</th><th>Address</th><th>RERA Registration Number</th></tr></thead><tbody>${orgRows}</tbody></table>
    <div class="row">Status of the Real Estate Projects mentioned above:</div>
    <table><thead><tr><th>S.No</th><th>RERA Reg. Number</th><th>Proposed Date of Completion</th><th>Complaints pending</th><th>Warrants issued</th><th>Revoked by RERA?</th></tr></thead><tbody>${statRows}</tbody></table>
    <div class="sig">(Signature)<br><br><b>${esc(docName)}</b><br>Date: ${today()}</div>`);
}

/* Split preview content into A4-proportioned pages with "Page X of Y" footers.
   Long tables are cut row-by-row and the header row repeats on the next page. */
function mkPgTable(theadHTML){const t=document.createElement('table');t.innerHTML=theadHTML+'<tbody></tbody>';return t;}
function paginateInto(box,html){
  const innerW=Math.max(280,box.clientWidth-52);
  const pageH=Math.round(innerW*1.414);          // A4 aspect ratio
  box.innerHTML='';
  const meas=document.createElement('div');
  meas.style.cssText=`position:absolute;left:-9999px;top:0;width:${innerW}px;visibility:hidden;`;
  box.appendChild(meas);
  meas.innerHTML=html;
  const units=[];
  [...meas.children].forEach(el=>{
    if(el.tagName==='TABLE'){
      const theadHTML=el.tHead?el.tHead.outerHTML:'';
      [...(el.tBodies[0]?.rows||[])].forEach((tr,i)=>units.push({row:true,theadHTML,trHTML:tr.outerHTML,first:i===0}));
    }else units.push({el});
  });
  meas.innerHTML='';
  const pages=[];let pg=document.createElement('div');pg.className='pg';meas.appendChild(pg);
  let curTable=null;
  const newPage=()=>{pages.push(pg);pg=document.createElement('div');pg.className='pg';meas.appendChild(pg);curTable=null;};
  const overflows=()=>pg.scrollHeight>pageH;
  for(const u of units){
    if(u.row){
      if(!curTable||u.first){curTable=mkPgTable(u.theadHTML);pg.appendChild(curTable);}
      curTable.tBodies[0].insertAdjacentHTML('beforeend',u.trHTML);
      if(overflows()&&(pg.children.length>1||curTable.tBodies[0].rows.length>1)){
        curTable.tBodies[0].lastElementChild.remove();
        if(!curTable.tBodies[0].rows.length) curTable.remove();
        newPage();
        curTable=mkPgTable(u.theadHTML);pg.appendChild(curTable);
        curTable.tBodies[0].insertAdjacentHTML('beforeend',u.trHTML);
      }
    }else{
      pg.appendChild(u.el);
      if(overflows()&&pg.children.length>1){u.el.remove();newPage();pg.appendChild(u.el);}
      curTable=null;
    }
  }
  pages.push(pg);
  box.innerHTML='';
  pages.forEach((p,i)=>{
    p.style.minHeight=pageH+'px';
    p.insertAdjacentHTML('beforeend',`<div class="pgnum">Page ${i+1} of ${pages.length}</div>`);
    box.appendChild(p);
  });
}

/* ---------- Multi-select chips ---------- */
let SELECTED=[];   // person objects picked from the dropdown
function renderChips(){
  $('#chips').innerHTML=SELECTED.map((p,i)=>
    `<span class="chip">${esc(p.name)}<span class="x" title="Remove" onclick="event.stopPropagation();removeChip(${i})">×</span></span>`
  ).join('');
}
function addChip(p){
  // Toggle: picking an already-selected name removes it again.
  const at=SELECTED.findIndex(s=>s.id===p.id);
  if(at>=0) SELECTED.splice(at,1); else SELECTED.push(p);
  renderChips();
  search();
  renderSuggest();   // keep the dropdown open so more names can be picked
  $('#q').focus();
}
function removeChip(i){SELECTED.splice(i,1);renderChips();search();}

function mergedEntity(sel){
  // Union of all projects across the selected names, duplicates removed.
  const seen=new Set(), orgs=[];
  for(const p of sel) for(const o of p.orgs){
    const k=(o.rera||'')+'|'+(o.name||'');
    if(seen.has(k)) continue; seen.add(k); orgs.push(o);
  }
  return {id:99999998,name:sel[0].name,docName:sel[0].name,merged:true,
    label:sel.map(p=>p.name).join(' + '),sources:sel.length,din:'',orgs};
}

async function search(){
  const q=$('#q').value.trim();
  if(SELECTED.length){
    const sel=[...SELECTED];
    PEOPLE=sel.length>1?[mergedEntity(sel),...sel]:sel;
    $('#countPill').textContent=`${sel.length} selected`;
    const banner=sel.length>1
      ?`<div class="hint" style="margin:0 2px 12px;">The first card combines all projects from the selected names (duplicates removed) — use it to generate one Annexure for the same person under different names.</div>`
      :'';
    $('#results').innerHTML=banner+PEOPLE.map(cardOf).join('');
    setActive(PEOPLE[0].id);
    return;
  }
  const data=await (await fetch('/api/search?q='+encodeURIComponent(q))).json();
  PEOPLE=data.results;
  $('#countPill').textContent=`${data.count} ${data.count===1?'match':'matches'}`;
  const box=$('#results');
  if(!PEOPLE.length){
    if(q.length>=2){
      // Name not found -> offer the "No" Annexure (NA tables, answer = No).
      PEOPLE=[{id:-1,name:q,din:'',orgs:[],notFound:true}];
      box.innerHTML=`<div class="hint" style="margin:0 2px 12px;">No match found — you can still generate a “No” Annexure for this name.</div>`+PEOPLE.map(cardOf).join('');
      setActive(-1);return;
    }
    const msg=data.message||'No matching organisation found.';
    box.innerHTML=`<div class="glass empty" style="padding:18px;">${esc(msg)}</div>`;renderPreview(null);return;
  }
  let banner='';
  if(data.capped){banner=`<div class="hint" style="margin:0 2px 12px;">Showing first ${data.shown} of ${data.count} matches — refine your search to narrow it down.</div>`;}
  box.innerHTML=banner+PEOPLE.map(cardOf).join('');
  setActive(PEOPLE[0].id);
}

async function generate(pid,btn){
  const keep=readKeep(pid);
  const p=PEOPLE.find(x=>x.id===pid);
  // Person has orgs but none ticked -> warn. Person with no orgs -> allow (NA doc).
  if(!keep.length && p && p.orgs.length>0){alert('Tick at least one organization.');return;}
  btn.disabled=true;const old=btn.textContent;btn.textContent='Generating…';
  try{
    let body;
    if(p&&p.notFound){
      body={custom_name:p.name,keep_indexes:[],din:readDin(pid)};
    }else if(p&&p.merged){
      // Merged multi-name card: send the kept rows directly with the chosen name.
      const chosen=p.orgs.filter((_,i)=>keep.includes(i));
      body={custom_name:readName(p),orgs:chosen,din:readDin(pid)};
    }else{
      body={person_id:pid,keep_indexes:keep,din:readDin(pid)};
    }
    const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    if(!r.ok){alert((await r.json()).error||'Failed.');return;}
    const blob=await r.blob();
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="?([^"]+)"?/);
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=m?m[1]:'Annexure A.docx';a.click();URL.revokeObjectURL(a.href);
  }finally{btn.disabled=false;btn.textContent=old;}
}

/* ---------- Autocomplete dropdown ---------- */
let sugItems=[], sugSel=-1, sugTimer=null, sugSeq=0;
function hideSuggest(){$('#suggest').classList.remove('open');sugItems=[];sugSel=-1;}
function pickSuggest(i){const p=sugItems[i];if(p)addChip(p);}
function renderSuggest(){
  const box=$('#suggest');
  if(!sugItems.length){hideSuggest();return;}
  box.innerHTML=sugItems.map((p,i)=>`
    <div class="sug${i===sugSel?' sel':''}" onmousedown="event.preventDefault();pickSuggest(${i})">
      <b>${SELECTED.some(s=>s.id===p.id)?'✓ ':''}${esc(p.name)}</b>
      <span class="tag">${p.orgs.length} project(s)</span>
    </div>`).join('');
  box.classList.add('open');
}
async function updateSuggest(){
  const q=$('#q').value.trim();
  if(q.length<2){hideSuggest();return;}
  const seq=++sugSeq;
  try{
    const data=await (await fetch('/api/search?q='+encodeURIComponent(q))).json();
    if(seq!==sugSeq) return;   // a newer request finished already
    sugItems=(data.results||[]).slice(0,8);
    sugSel=-1;
    renderSuggest();
  }catch(_){hideSuggest();}
}
$('#q').addEventListener('input',()=>{clearTimeout(sugTimer);sugTimer=setTimeout(updateSuggest,150);});
// Reopen the dropdown when clicking back into a search box that already has text.
$('#q').addEventListener('focus',()=>updateSuggest());
$('#q').addEventListener('click',()=>{if(!$('#suggest').classList.contains('open'))updateSuggest();});
$('#q').addEventListener('blur',()=>setTimeout(hideSuggest,150));
$('#q').addEventListener('keydown',e=>{
  const open=$('#suggest').classList.contains('open');
  if(e.key==='ArrowDown'&&open){e.preventDefault();sugSel=Math.min(sugSel+1,sugItems.length-1);renderSuggest();}
  else if(e.key==='ArrowUp'&&open){e.preventDefault();sugSel=Math.max(sugSel-1,0);renderSuggest();}
  else if(e.key==='Escape'){hideSuggest();}
  else if(e.key==='Backspace'&&!$('#q').value&&SELECTED.length){removeChip(SELECTED.length-1);}
  else if(e.key==='Enter'){
    if(open&&sugSel>=0){pickSuggest(sugSel);}
    else{hideSuggest();search();}
  }
});
$('#searchBtn').onclick=()=>{hideSuggest();search();};
$('#reloadBtn').onclick=async()=>{await fetch('/api/reload',{method:'POST'});await loadSource();await search();};

// boot: run data load behind the splash, then reveal
loadSource();search();
window.addEventListener('load',()=>{
  setTimeout(()=>{ document.body.classList.add('ready'); },2200);
  setTimeout(()=>{ const i=$('#intro'); if(i) i.classList.add('hide'); },2400);
  setTimeout(()=>{ const i=$('#intro'); if(i) i.remove(); },3200);
});
</script>
