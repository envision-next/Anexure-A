<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annexure A Generator · Envision Next</title>
<link rel="icon" type="image/png" href="static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<style>
  :root{
    --bg:#eef1f8; --bg-2:#f7f9fe;
    --card:#ffffff; --card-2:#f4f6fb;
    --border:#e6e9f2; --border-hover:rgba(91,124,255,.55);
    --text:#141824; --muted:#707892;
    --accent:#5b7cff; --accent-2:#9b6bff; --accent-3:#e08bff;
    --glow:rgba(91,124,255,.22);
    --hero:linear-gradient(100deg,#5b7cff,#9b6bff 60%,#e08bff);
    --shadow:0 1px 2px rgba(20,30,70,.04),0 12px 34px -18px rgba(30,40,90,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,Arial,sans-serif; color:var(--text);
    background:
      radial-gradient(1100px 480px at 88% -8%,rgba(224,139,255,.12),transparent 60%),
      radial-gradient(1000px 460px at -6% 6%,rgba(91,124,255,.12),transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh; position:relative; overflow-x:hidden;
  }

  /* ---------- INTRO SPLASH (dark) ---------- */
  #intro{
    position:fixed; inset:0; z-index:50; display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 35%,#0b0d16 0%,#07080f 60%,#05060a 100%);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #intro::before,#intro::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;}
  #intro::before{width:420px;height:420px;background:var(--accent);top:12%;left:20%;opacity:.5;}
  #intro::after{width:380px;height:380px;background:var(--accent-3);bottom:12%;right:20%;opacity:.42;}
  #intro.hide{opacity:0; visibility:hidden;}
  .intro-inner{position:relative;z-index:1;text-align:center;transform:translateY(6px);animation:introRise .9s cubic-bezier(.2,.7,.2,1) both;}
  .intro-logo{
    width:min(440px,72vw);margin:0 auto 14px;display:block;
    filter:drop-shadow(0 14px 40px rgba(91,124,255,.5));
    animation:pop .8s cubic-bezier(.2,1.3,.3,1) both;
  }
  .intro-title{
    font-family:'Space Grotesk';font-weight:700;font-size:38px;margin:0;letter-spacing:-.5px;
    background:linear-gradient(100deg,#7d97ff,#b58bff 50%,#e08bff,#7d97ff);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 2.2s linear infinite;
  }
  .intro-sub{color:#9aa3bd;font-size:13px;margin-top:8px;letter-spacing:.18em;text-transform:uppercase;}
  .intro-status{color:#6f7890;font-size:12px;margin-top:16px;}
  .intro-bar{width:180px;height:4px;margin:14px auto 0;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;}
  .intro-bar > span{display:block;height:100%;width:0;border-radius:999px;background:var(--hero);animation:fill 2.1s ease forwards;}
  @keyframes introRise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
  @keyframes shimmer{to{background-position:220% center;}}
  @keyframes fill{0%{width:0;}100%{width:100%;}}

  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:26px 22px 70px;
        opacity:0; transition:opacity .6s ease .1s;}
  body.ready .wrap{opacity:1;}

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-logo{height:38px;width:auto;display:block;}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--border);font-weight:500;
        padding:7px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);}

  .glass{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow);
  }
  .source{font-size:12px;padding:8px 13px;border-radius:999px;display:inline-flex;gap:8px;
          align-items:center;margin-bottom:18px;border:1px solid var(--border);}
  .source .dot{width:8px;height:8px;border-radius:50%;}
  .source.real{background:rgba(16,185,129,.12);color:#047857;}
  .source.real .dot{background:#10b981;}
  .source.sample{background:rgba(224,139,255,.14);color:#9333ea;}
  .source.sample .dot{background:var(--accent-3);}

  .searchbar{display:flex;gap:10px;padding:14px;margin-bottom:22px;position:relative;}
  .searchwrap{flex:1;position:relative;}
  .searchwrap input{width:100%;}
  input[type=date]{padding:12px 13px;font-size:14px;color:var(--text);font-family:'Inter';
    background:var(--card-2);border:1px solid var(--border);border-radius:11px;outline:none;cursor:pointer;}
  input[type=date]:focus{border-color:var(--border-hover);box-shadow:0 0 0 3px var(--glow);}
  #suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;
    background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
    max-height:320px;overflow:auto;display:none;}
  #suggest.open{display:block;}
  .sug{padding:10px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;
    gap:10px;align-items:center;border-bottom:1px solid var(--line-soft,#eef1f7);}
  .sug:last-child{border-bottom:none;}
  .sug:hover,.sug.sel{background:var(--card-2);}
  .sug .tag{font-size:11px;color:var(--muted);white-space:nowrap;}
  .sug b{font-weight:600;}
  input[type=text]{flex:1;padding:13px 15px;font-size:15px;color:var(--text);
    background:var(--card-2);border:1px solid var(--border);border-radius:11px;outline:none;
    transition:border .15s,box-shadow .15s,background .15s;}
  input[type=text]:hover{background:#fff;}
  input[type=text]::placeholder{color:var(--muted);}
  input[type=text]:focus{border-color:var(--border-hover);box-shadow:0 0 0 3px var(--glow);}
  button{font-family:'Inter';font-weight:600;padding:13px 18px;font-size:14px;border:none;
    border-radius:12px;cursor:pointer;color:#fff;background:var(--hero);
    box-shadow:0 12px 26px -12px var(--glow);transition:transform .12s,filter .12s,opacity .12s;}
  button:hover{transform:translateY(-1px);filter:brightness(1.05);}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  button.ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border);box-shadow:none;}
  button.ghost:hover{background:#fff;}

  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .person{padding:18px;margin-bottom:16px;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s;}
  .person::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hero);opacity:0;transition:opacity .18s;}
  .person.active{border-color:var(--border-hover);box-shadow:0 1px 2px rgba(20,30,70,.04),0 18px 44px -22px var(--glow);}
  .person.active::before{opacity:1;}
  .person h3{font-family:'Space Grotesk';margin:0 0 12px;font-size:17px;}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .field label{font-size:12px;color:var(--muted);min-width:120px;font-weight:500;}
  .field input{max-width:260px;padding:9px 12px;font-size:14px;background:var(--card-2);
    border:1px solid var(--border);border-radius:9px;outline:none;transition:border .15s,box-shadow .15s;}
  .field input:focus{border-color:var(--border-hover);box-shadow:0 0 0 3px var(--glow);background:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  td.addr{color:#3b4252;max-width:240px;}
  tr.off td:not(.chk){opacity:.35;text-decoration:line-through;}
  .chk{width:34px;}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
  .actions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .hint{color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);padding:16px 4px;}

  .preview-col{position:sticky;top:20px;}
  .preview-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
  .preview-head .t{font-family:'Space Grotesk';font-weight:600;font-size:14px;}
  .live-tag{font-size:11px;color:#047857;display:flex;align-items:center;gap:6px;}
  .live-tag .dot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5);}70%{box-shadow:0 0 0 8px rgba(16,185,129,0);}100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}}
  .paper{background:#fff;color:#111;border-radius:0 0 16px 16px;padding:26px 26px 30px;
         font-family:'Times New Roman',serif;max-height:74vh;overflow:auto;}
  .paper h2{text-align:center;font-size:15px;margin:0 0 2px;}
  .paper .center{text-align:center;font-size:12px;color:#333;margin-bottom:14px;}
  .paper .row{font-size:13px;margin:6px 0;}
  .paper table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-family:'Times New Roman',serif;}
  .paper th,.paper td{border:1px solid #333;color:#111;padding:5px 7px;font-size:11.5px;text-transform:none;letter-spacing:0;}
  .paper th{background:#f0f0f0;font-weight:700;}
  .paper .sig{margin-top:22px;font-size:13px;}
</style>
</head>
<body>

<div id="intro">
  <div class="intro-inner">
    <img class="intro-logo" src="static/logo.png" alt="Envision Next">
    <h1 class="intro-title">Annexure A Generator</h1>
    <div class="intro-sub">Envision Next</div>
    <div class="intro-status" id="introStatus">Loading registry data…</div>
    <div class="intro-bar"><span></span></div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <img class="brand-logo" src="static/logo-inside.png" alt="Envision Next">
    </div>
    <div class="pill" id="countPill">—</div>
  </header>

  <div id="source" class="source sample"><span class="dot"></span> Loading data…</div>

  <div class="glass searchbar">
    <div class="searchwrap">
      <input id="q" type="text" placeholder="Search a person (partner/director) or organisation name…" autocomplete="off">
      <div id="suggest"></div>
    </div>
    <input id="fromDate" type="date" title="Show only projects with completion date on or after this date" onchange="search()">
    <button id="searchBtn">Search</button>
  </div>
  <div class="hint" style="margin:-12px 2px 22px;">Type at least 2 letters of a name · Pick a start date to show only projects with completion date on or after it (leave empty for all).</div>

  <div class="grid">
    <div id="results"></div>
    <div class="preview-col">
      <div class="glass" style="overflow:hidden;">
        <div class="preview-head">
          <span class="t">Live Preview</span>
          <span class="live-tag"><span class="dot"></span> live</span>
        </div>
        <div id="preview" class="paper"><div style="color:#888;font-family:Inter;">Search and select an organisation to preview its Annexure A.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s)=>document.querySelector(s);
let ENTITIES = [];   // all organisations from the Excel
let PEOPLE = [];     // current search results
let activePid = null;

function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function today(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;}

/* ---------- Load the Excel in the browser ---------- */
function cellStr(v){
  if(v==null) return '';
  if(v instanceof Date){const p=n=>String(n).padStart(2,'0');return `${p(v.getDate())}/${p(v.getMonth()+1)}/${v.getFullYear()}`;}
  return String(v).trim();
}
async function loadExcel(){
  const st=$('#introStatus');
  try{
    st.textContent='Downloading registry (12 MB)…';
    const res=await fetch('Anexure%20A.xlsx');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const buf=await res.arrayBuffer();
    st.textContent='Parsing spreadsheet…';
    await new Promise(r=>setTimeout(r,30)); // let the status paint
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    const hdr=rows[0].map(h=>(h||'').toString().toLowerCase());
    const col=(...keys)=>hdr.findIndex(h=>keys.every(k=>h.includes(k)));
    const iOrg=col('organisation')>=0?col('organisation'):col('organization');
    const iRera=col('rera');
    const iAddr=col('address');
    const iComp=col('completion');
    const iCmpl=col('complaint');
    const iPart=col('partner');
    const iProj=col('project','name');
    const orgMap=new Map();     // organisation name -> entity
    const personMap=new Map();  // person name (lowercase) -> entity
    for(let r=1;r<rows.length;r++){
      const row=rows[r]; if(!row) continue;
      const org=cellStr(row[iOrg]) || cellStr(row[iProj]);  // fall back to project name
      if(!org && !cellStr(row[iRera])) continue;            // truly empty row
      const proj={
        name:org||'NA',
        address:cellStr(row[iAddr]),
        rera:cellStr(row[iRera]),
        completion:cellStr(row[iComp]),
        complaints:cellStr(row[iCmpl])||'No',
        warrants:'No',
        revoked:'No',
      };
      if(org){
        let e=orgMap.get(org);
        if(!e){e={name:org,din:'',type:'org',role:'',orgs:[]};orgMap.set(org,e);}
        e.orgs.push(proj);
      }
      // Parse "Partner Details" -> "Designation: [Name1, Name2], Designation2: [Name3]"
      if(iPart>=0){
        const pd=cellStr(row[iPart]);
        if(pd && pd.toUpperCase()!=='NA'){
          // "Designation: [Name1, Name2], Designation2: [Name3]" — or bare "[Name1, Name2]"
          const groups=[];
          const re=/([^:\[\],]+):\s*\[([^\]]*)\]/g; let m;
          while((m=re.exec(pd))!==null) groups.push([m[1].trim(),m[2]]);
          if(!groups.length){
            const bare=pd.match(/\[([^\]]*)\]/);
            if(bare) groups.push(['',bare[1]]);
          }
          for(const [desig,names] of groups){
            for(const nm of names.split(',').map(s=>s.trim()).filter(Boolean)){
              const key=nm.toLowerCase();
              let pe=personMap.get(key);
              if(!pe){pe={name:nm,din:'',type:'person',role:desig,orgs:[]};personMap.set(key,pe);}
              if(desig && pe.role.indexOf(desig)<0) pe.role=pe.role?pe.role+' / '+desig:desig;
              // avoid duplicate project rows for the same person
              if(!pe.orgs.some(o=>o.rera===proj.rera)) pe.orgs.push(proj);
            }
          }
        }
      }
    }
    ENTITIES=[...personMap.values(),...orgMap.values()];
    ENTITIES.forEach((e,i)=>e.id=i);
    const el=$('#source');
    el.className='source real';
    el.innerHTML=`<span class="dot"></span> Registry loaded: <b>&nbsp;${personMap.size.toLocaleString()}</b>&nbsp;people · <b>&nbsp;${orgMap.size.toLocaleString()}</b>&nbsp;organisations · ${(rows.length-1).toLocaleString()} projects`;
    $('#countPill').textContent=`${personMap.size.toLocaleString()} people · ${orgMap.size.toLocaleString()} orgs`;
  }catch(err){
    const el=$('#source');
    el.className='source sample';
    el.innerHTML='<span class="dot"></span> Could not load Anexure A.xlsx — '+esc(err.message);
  }
  // reveal the app
  document.body.classList.add('ready');
  const i=$('#intro'); if(i){i.classList.add('hide'); setTimeout(()=>i.remove(),800);}
}

/* ---------- Search ---------- */
function search(){
  const q=$('#q').value.trim().toLowerCase();
  const box=$('#results');
  if(q.length<2){
    PEOPLE=[];
    box.innerHTML='<div class="glass empty" style="padding:18px;">Type at least 2 letters of an organisation name.</div>';
    renderPreview(null);return;
  }
  const CAP=50; let total=0; const out=[];
  for(const e of ENTITIES){
    if(e.name.toLowerCase().includes(q)){
      total++;
      if(out.length<CAP) out.push(e);
    }
  }
  PEOPLE=out;
  $('#countPill').textContent=`${total} ${total===1?'match':'matches'}`;
  if(!out.length){
    // Not in the registry -> still allow an Annexure, stating "No" with NA tables.
    const nice=$('#q').value.trim().replace(/\S+/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
    const ghost={id:99999999,name:nice,din:'',type:'person',role:'Not found in registry',orgs:[]};
    PEOPLE=[ghost];
    box.innerHTML=`<div class="hint" style="margin:0 2px 12px;">No registered projects found for “${esc(nice)}” — the Annexure will state “No”.</div>`+cardOf(ghost);
    setActive(ghost.id);
    return;
  }
  let banner='';
  if(total>out.length){banner=`<div class="hint" style="margin:0 2px 12px;">Showing first ${out.length} of ${total} matches — refine your search to narrow it down.</div>`;}
  box.innerHTML=banner+out.map(cardOf).join('');
  setActive(out[0].id);
}

function parseDMY(s){
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s||'').trim());
  return m?new Date(+m[3],+m[2]-1,+m[1]):null;
}
function isNAProj(o){
  const na=v=>!v||String(v).trim().toUpperCase()==='NA';
  return na(o.rera)||na(o.name)||na(o.completion);
}
function dateRange(){
  const v=$('#fromDate').value;
  if(!v) return null;
  // From the selected date onwards — no upper limit.
  return {from:new Date(v+'T00:00:00')};
}
function cardOf(p){
  const rng=dateRange();
  const visible=p.orgs.map((o,i)=>({o,i})).filter(({o})=>{
    if(!rng) return true;
    const d=parseDMY(o.completion);
    return d && d>=rng.from;
  });
  const rows=visible.map(({o,i},n)=>{
    const off=isNAProj(o);
    return `
    <tr data-i="${i}" class="${off?'off':'on'}">
      <td class="chk"><input type="checkbox" ${off?'':'checked'} onchange="onChange(${p.id})"></td>
      <td>${n+1}</td>
      <td>${esc(o.name)}</td>
      <td class="addr">${esc(o.address)}</td>
      <td>${esc(o.rera)}</td>
      <td>${esc(o.completion)}</td>
    </tr>`;}).join('');
  const hidden=p.orgs.length-visible.length;
  return `
  <div class="glass person" data-pid="${p.id}" onclick="setActive(${p.id})">
    <h3>${esc(p.name)}</h3>
    ${p.type==='person'?`<div class="hint" style="margin:-8px 0 12px;">${p.role?esc(p.role)+' · ':''}${p.orgs.length} project(s)${hidden>0?` · ${hidden} outside date range`:''}</div>`:''}
    <div class="field">
      <label for="din-${p.id}">DIN/DPIN (If applicable)</label>
      <input id="din-${p.id}" type="text" value="${esc(p.din)}" placeholder="Enter DIN/DPIN"
             oninput="onChange(${p.id})">
    </div>
    <table>
      <thead><tr>
        <th class="chk"><input type="checkbox" checked title="Select all / remove all" onchange="toggleAll(${p.id},this.checked)"></th>
        <th>S.No</th><th>Organization</th><th>Address</th><th>RERA No.</th><th>Completion</th>
      </tr></thead>
      <tbody>${rows||'<tr><td class="chk"></td><td>NA</td><td>NA</td><td>NA</td><td>NA</td><td>NA</td></tr>'}</tbody>
    </table>
    <div class="actions">
      <button onclick="event.stopPropagation();generate(${p.id},this)">Generate Word</button>
      <span class="hint">Only ticked rows are included · Date auto-set to today · Place removed.</span>
    </div>
  </div>`;
}

function personCardEl(pid){return document.querySelector(`.person[data-pid="${pid}"]`);}
function readDin(pid){const el=$(`#din-${pid}`);return el?el.value:'';}
function readKeep(pid){
  const card=personCardEl(pid); if(!card) return [];
  return [...card.querySelectorAll('tbody tr[data-i]')]
    .filter(tr=>tr.querySelector('input[type=checkbox]')?.checked)
    .map(tr=>parseInt(tr.dataset.i,10));
}
function setActive(pid){
  activePid=pid;
  document.querySelectorAll('.person').forEach(c=>c.classList.toggle('active',+c.dataset.pid===pid));
  renderPreview(pid);
}
function toggleAll(pid,checked){
  const card=personCardEl(pid); if(!card) return;
  card.querySelectorAll('tbody tr[data-i] input[type=checkbox]').forEach(cb=>{cb.checked=checked;});
  onChange(pid);
}
function onChange(pid){
  const card=personCardEl(pid);
  card.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
    const on=tr.querySelector('input[type=checkbox]')?.checked;
    tr.classList.toggle('off',!on);tr.classList.toggle('on',!!on);
  });
  setActive(pid);
}

/* ---------- Live preview ---------- */
function renderPreview(pid){
  const p=PEOPLE.find(x=>x.id===pid);
  const box=$('#preview');
  if(!p){box.innerHTML='<div style="color:#888;font-family:Inter;">Search and select an organisation to preview.</div>';return;}
  const din=readDin(pid);
  const keep=new Set(readKeep(pid));
  const chosen=p.orgs.filter((_,i)=>keep.has(i));
  const orgRows=chosen.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.name)}</td><td>${esc(o.address)}</td><td>${esc(o.rera)}</td></tr>`).join('')
    || '<tr><td>NA</td><td>NA</td><td>NA</td><td>NA</td></tr>';
  const statRows=chosen.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.rera)}</td><td>${esc(o.completion)}</td><td>${esc(o.complaints)}</td><td>${esc(o.warrants)}</td><td>${esc(o.revoked)}</td></tr>`).join('')
    || '<tr><td>NA</td><td>NA</td><td>NA</td><td>NA</td><td>NA</td><td>NA</td></tr>';
  box.innerHTML=`
    <h2>Annexure A</h2>
    <div class="center">Disclosure of Interest in Other Real Estate Organizations</div>
    <div class="row"><b>Name:</b> ${esc(p.name)}</div>
    <div class="row"><b>DIN/DPIN (If applicable):</b> ${esc(din)||'—'}</div>
    <div class="row">Are you a Director/ Designated Partner/ Partner/ Proprietor of any organization whose real estate project is registered with any RERA across the country? – <b>${chosen.length?'Yes':'No'}</b></div>
    <div class="row">If yes, please provide the following information:</div>
    <table><thead><tr><th>S.No</th><th>Name of the organization</th><th>Address</th><th>RERA Registration Number</th></tr></thead><tbody>${orgRows}</tbody></table>
    <div class="row">Status of the Real Estate Projects mentioned above:</div>
    <table><thead><tr><th>S.No</th><th>RERA Reg. Number</th><th>Proposed Date of Completion</th><th>Complaints pending</th><th>Warrants issued</th><th>Revoked by RERA?</th></tr></thead><tbody>${statRows}</tbody></table>
    <div class="sig">(Signature)<br><br><b>${esc(p.name)}</b><br>Date: ${today()}</div>`;
}

/* ---------- Word generation (in browser, via docx.js) ---------- */
function generate(pid,btn){
  const p=PEOPLE.find(x=>x.id===pid); if(!p) return;
  const keep=readKeep(pid);
  if(!keep.length && p.orgs.length>0){alert('Tick at least one organization.');return;}
  const chosen=p.orgs.filter((_,i)=>keep.includes(i));
  const din=readDin(pid);

  const D=window.docx;
  const F='Times New Roman', SZ=22; // 11pt
  const t=(text,opts={})=>new D.TextRun({text,font:F,size:SZ,...opts});
  const para=(children,opts={})=>new D.Paragraph({children,spacing:{after:120},...opts});
  const cell=(text,bold=false)=>new D.TableCell({
    children:[new D.Paragraph({children:[t(String(text),{bold})]})],
    margins:{top:60,bottom:60,left:80,right:80},
  });
  const row=(vals,bold=false)=>new D.TableRow({children:vals.map(v=>cell(v,bold))});

  const na = chosen.length===0;
  const orgRows = na ? [row(['NA','NA','NA','NA'])]
    : chosen.map((o,i)=>row([i+1,o.name,o.address,o.rera]));
  const statRows = na ? [row(['NA','NA','NA','NA','NA','NA'])]
    : chosen.map((o,i)=>row([i+1,o.rera,o.completion,o.complaints,o.warrants,o.revoked]));

  const fullW={size:100,type:D.WidthType.PERCENTAGE};

  const doc=new D.Document({sections:[{properties:{},children:[
    para([t('Annexure A',{bold:true,size:26})],{alignment:D.AlignmentType.CENTER}),
    para([t('Disclosure of Interest in Other Real Estate Organizations',{bold:true})],{alignment:D.AlignmentType.CENTER}),
    para([]),
    para([t('Name: ',{bold:true}),t(p.name)]),
    para([t('DIN/DPIN (If applicable): ',{bold:true}),t(din||'NA')]),
    para([t('Are you a Director/ Designated Partner/ Partner/ Proprietor of any organization whose real estate project is registered with any Real Estate Regulatory Authority (RERA) across the country? – '),t(na?'No':'Yes',{bold:true})]),
    para([t('If yes, please provide the following information:')]),
    new D.Table({width:fullW,rows:[
      row(['S. No.','Name of the organization','Address','RERA Registration Number of each of the registered projects'],true),
      ...orgRows,
    ]}),
    para([]),
    para([t('Status of the Real Estate Projects mentioned above:')]),
    new D.Table({width:fullW,rows:[
      row(['S. No.','RERA Registration Number','Proposed Date of Completion','Any Complaints pending against the Project in RERA. If yes, the Complaint Number','Any Warrants issued against the Project by RERA (Yes/No)','Has the Project been revoked by RERA? (Yes/No)'],true),
      ...statRows,
    ]}),
    para([]),
    para([t('(Signature)')]),
    para([]),
    para([t(p.name,{bold:true})]),
    para([t('Date: '+today())]),
  ]}]});

  btn.disabled=true;const old=btn.textContent;btn.textContent='Generating…';
  D.Packer.toBlob(doc).then(blob=>{
    const safe=p.name.replace(/[^\w \-]/g,'').trim();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${safe} - Annexure A.docx`;
    a.click();URL.revokeObjectURL(a.href);
  }).finally(()=>{btn.disabled=false;btn.textContent=old;});
}

/* ---------- Autocomplete dropdown ---------- */
let sugItems=[], sugSel=-1, sugTimer=null;
function hideSuggest(){$('#suggest').classList.remove('open');sugItems=[];sugSel=-1;}
function pickSuggest(name){$('#q').value=name;hideSuggest();search();}
function renderSuggest(){
  const box=$('#suggest');
  if(!sugItems.length){hideSuggest();return;}
  box.innerHTML=sugItems.map((e,i)=>`
    <div class="sug${i===sugSel?' sel':''}" onmousedown="event.preventDefault();pickSuggest(${JSON.stringify(e.name).replace(/"/g,'&quot;')})">
      <b>${esc(e.name)}</b>
      <span class="tag">${e.type==='person'?esc(e.role||'Person'):'Organisation'} · ${e.orgs.length} project(s)</span>
    </div>`).join('');
  box.classList.add('open');
}
function updateSuggest(){
  const q=$('#q').value.trim().toLowerCase();
  if(q.length<2||!ENTITIES.length){hideSuggest();return;}
  const starts=[],contains=[];
  for(const e of ENTITIES){
    const n=e.name.toLowerCase();
    if(n.startsWith(q)) starts.push(e);
    else if(n.includes(q)) contains.push(e);
    if(starts.length>=8) break;
  }
  sugItems=[...starts,...contains].slice(0,8);
  sugSel=-1;
  renderSuggest();
}
$('#q').addEventListener('input',()=>{clearTimeout(sugTimer);sugTimer=setTimeout(updateSuggest,120);});
$('#q').addEventListener('blur',()=>setTimeout(hideSuggest,150));
$('#q').addEventListener('keydown',e=>{
  const open=$('#suggest').classList.contains('open');
  if(e.key==='ArrowDown'&&open){e.preventDefault();sugSel=Math.min(sugSel+1,sugItems.length-1);renderSuggest();}
  else if(e.key==='ArrowUp'&&open){e.preventDefault();sugSel=Math.max(sugSel-1,0);renderSuggest();}
  else if(e.key==='Escape'){hideSuggest();}
  else if(e.key==='Enter'){
    if(open&&sugSel>=0){pickSuggest(sugItems[sugSel].name);}
    else{hideSuggest();search();}
  }
});
$('#searchBtn').onclick=()=>{hideSuggest();search();};
loadExcel();
</script>
